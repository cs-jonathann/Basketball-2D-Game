<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2D Basketball</title>
  <meta name="description" content="A 1-on-1 2D basketball game against a CPU opponent, playable in the browser. Built by Jonathan Velasquez.">
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" href="assets/ball.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- loaded without blocking the page; the game falls back to system fonts if this is slow -->
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <style>
    :root {
      --bg: #0b1020;
      --ink: #e8ecf6;
      --muted: #8f9ab5;
      --accent: #ff7a1a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Rubik", system-ui, sans-serif;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #stage {
      position: relative;
      width: min(100vw, calc((100vh - 36px) * 1.5833));
      aspect-ratio: 1710 / 1080;
      max-height: calc(100vh - 36px);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
      outline: none;
      image-rendering: auto;
    }
    footer {
      height: 36px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 13px;
      color: var(--muted);
      padding: 0 16px;
      text-align: center;
    }
    footer a { color: var(--ink); text-decoration: none; border-bottom: 1px solid #3a4560; }
    footer a:hover { border-color: var(--accent); }
    noscript { position: absolute; inset: 0; display: grid; place-items: center; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1710" height="1080" tabindex="0" aria-label="2D Basketball game"></canvas>
    <noscript>This game needs JavaScript enabled.</noscript>
  </div>
  <footer>
    <span>Built by Jonathan Velasquez</span>
    <span aria-hidden="true">·</span>
    <a href="https://github.com/cs-jonathann/Basketball-2D-Game" target="_blank" rel="noopener">Source on GitHub</a>
  </footer>
  <script src="sprites.js"></script>
  <script src="game.js"></script>
</body>
</html>
